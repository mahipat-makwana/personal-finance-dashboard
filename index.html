<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container-fluid p-2">
        <a href="#" class="navbar-brand">MoneyTrack</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a href="#dashboard" class="nav-link active" aria-current="page"
                >Dashboard</a
              >
            </li>
            <li class="nav-item"><a href="#transaction" class="nav-link">Transactions</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Budget</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Reports</a></li>
          </ul>

          <div class="dropdown ms-auto mt-2 mt-lg-0">
            <button
              type="button"
              class="btn btn-outline-light dropdown-toggle"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Mahipat
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a href="#" class="dropdown-item">Profile</a></li>
              <li><a href="#" class="dropdown-item">Settings</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a href="#" class="dropdown-item text-danger">Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <section id="dashboard" class="py-5">
        <div class="container py-4">
          <h1 class="fw-bold">Finance Dashboard</h1>
          <p class="text-muted">Track your income, expenses, and balance.</p>

          <div class="row g-4 mt-4">
            <div class="col-12">
              <h2 class="fw-bold">Summary</h2>
            </div>
            <div class="col-md-4 mb-3">
              <div class="card h-100 shadow-sm">
                <div class="card-body text-primary">
                  <h5 class="card-title fw-bold">Balance</h5>
                  <h2 id="balance" class="fw-bold">Rs. 0.00</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4 mb-3">
              <div class="card h-100 shadow-sm">
                <div class="card-body text-success">
                  <h5 class="card-title fw-bold">Income</h5>
                  <h2 id="income" class="fw-bold">Rs. 0.00</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4 mb-3">
              <div class="card h-100 shadow-sm">
                <div class="card-body text-danger">
                  <h5 class="card-title fw-bold">Expense</h5>
                  <h2 id="expense" class="fw-bold">Rs. 0.00</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="transactions" class="bg-light py-5">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-md-8">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h2 class="card-title fw-bold text-center">
                    Transaction
                  </h2>
                  <form class="p-4">
                    <div class="mb-3">
                        <fieldset>
                      <legend>Transaction Type</legend>
                      <input
                        type="radio"
                        id="choice1"
                        name="transactions"
                        value="income"
                        class="form-check-input"
                        checked
                      />
                      <label for="choice1" class="form-check-label">Income</label>
                      <input
                        type="radio"
                        id="choice2"
                        name="transactions"
                        value="expense"
                        class="form-check-input"
                      />
                      <label for="choice2" class="form-check-label">Expense</label>
                    </div>
                    </fieldset>
                    <div class="mb-3">
                      <label for="description" class="form-label"
                        >Description</label
                      >
                      <textarea
                        name="description"
                        id="description"
                        class="form-control"
                        rows="3"
                        placeholder="e.g. Grocery shopping"
                      ></textarea>
                    </div>
                    <div class="mb-3">
                      <div class="row">
                        <div class="col-md-4">
                          <label for="amount" class="form-label">Amount</label>
                          <input
                            type="number"
                            id="amount"
                            name="amount"
                            class="form-control"
                            placeholder="e.g. 1000"
                            min="0.1"
                            step="0.1"
                            required
                          />
                        </div>
                        <div class="col-md-4">
                          <div class="dropdown">
                            <button
                              class="btn btn-outline-light dropdown-toggle"
                              data-bs-toggle="dropdown"
                              type="button"
                              aria-expanded="false">
                              Category
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                              <li>Profile</li>
                              <li>Settings</li>
                              <li>Logout</li>
                            </ul>
                          </div>
                        </div>
                        <div class="col-md-4">
                          <label for="date" class="form-label">Date</label>
                          <input type="date" id="date" class="form-control" />
                        </div>
                      </div>
                    </div>
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary w-50">
                      Add Transaction
                    </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
